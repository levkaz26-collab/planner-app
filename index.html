<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Ежедневник заказов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Раскладка: 4 вкладки снизу, сверху навигация по датам, блоки «Заказы» и «Оплаты».
   Два независимых переключателя: тема (data-theme) и стиль (data-style: glass | flat). */
:root{
  --s-prep:#8C96A6; --s-ord:#3C7EF7; --s-paid:#3CB878; --s-over:#DE4848; --h:226; --dim:0; --al:42%; --as:55%;
  --bg:#e8ecf4; --ga:#f5f3ef; --bg1:hsl(var(--h) 86% 69% / .42); --bg2:hsl(calc(var(--h) - 32) 43% 65% / .42); --bg3:hsl(calc(var(--h) + 38) 50% 75% / .34);
  --surf:rgba(255,255,255,.44); --surf2:rgba(255,255,255,.58); --solid:#fff;
  --line:rgba(255,255,255,.9); --line2:rgba(20,30,50,.08); --edge:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 0 0 0 .5px rgba(255,255,255,.5),inset 0 -10px 14px -10px rgba(40,60,100,.12);
  --fx:0 8px 24px rgba(35,55,110,.16),0 0 0 .5px rgba(30,45,80,.2); --blur:blur(5px) saturate(1.4) brightness(1.05);
  --pbg:rgba(248,250,254,.5); --pblur:blur(6px) saturate(1.4) brightness(1.05); --navbg:rgba(255,255,255,.22); --nblur:blur(8px) saturate(1.4) brightness(1.05);
  --ink:#14171f; --mute:#3f4858; --blue:hsl(var(--h) var(--as) var(--al)); --blue2:hsl(var(--h) var(--as) var(--al) / .16); --blueline:hsl(var(--h) var(--as) var(--al) / .5); --onblue:#fff;
  --prep:#5B6578; --ord:#1F5FD6; --paid:#1D8050; --over:#C02F2F; --off:rgba(20,30,50,.2);
  --scrim:rgba(20,28,45,.35);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --ga:#17191e; --bg1:hsl(var(--h) 72% 57% / .4); --bg2:hsl(calc(var(--h) - 30) 54% 40% / .36); --bg3:hsl(calc(var(--h) + 26) 31% 50% / .32);
  --surf:rgba(255,255,255,.09); --surf2:rgba(255,255,255,.14); --solid:#1d2028;
  --line:rgba(255,255,255,.24); --line2:rgba(255,255,255,.09); --edge:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.07),inset 0 0 0 .5px rgba(255,255,255,.08),inset 0 -10px 14px -10px rgba(0,0,0,.35);
  --fx:0 10px 28px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3); --blur:blur(5px) saturate(1.4) brightness(1.05);
  --pbg:rgba(14,16,22,.5); --pblur:blur(6px) saturate(1.4) brightness(1.05); --navbg:rgba(255,255,255,.05); --nblur:blur(8px) saturate(1.4) brightness(1.05);
  --ink:#eceef3; --mute:#b4bbc8; --blue:hsl(var(--h) var(--as) var(--al)); --blue2:hsl(var(--h) var(--as) var(--al) / .16); --blueline:hsl(var(--h) var(--as) var(--al) / .5); --onblue:#0b1330;
  --prep:#B4BCCA; --ord:#7FADFF; --paid:#6FD9A0; --over:#FF8080; --off:rgba(255,255,255,.22);
  --scrim:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1117; --ga:#17191e; --bg1:hsl(var(--h) 72% 57% / .4); --bg2:hsl(calc(var(--h) - 30) 54% 40% / .36); --bg3:hsl(calc(var(--h) + 26) 31% 50% / .32);
  --surf:rgba(255,255,255,.09); --surf2:rgba(255,255,255,.14); --solid:#1d2028;
  --line:rgba(255,255,255,.24); --line2:rgba(255,255,255,.09); --edge:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.07),inset 0 0 0 .5px rgba(255,255,255,.08),inset 0 -10px 14px -10px rgba(0,0,0,.35);
  --fx:0 10px 28px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3); --blur:blur(5px) saturate(1.4) brightness(1.05);
  --pbg:rgba(14,16,22,.5); --pblur:blur(6px) saturate(1.4) brightness(1.05); --navbg:rgba(255,255,255,.05); --nblur:blur(8px) saturate(1.4) brightness(1.05);
  --ink:#eceef3; --mute:#b4bbc8; --blue:hsl(var(--h) var(--as) var(--al)); --blue2:hsl(var(--h) var(--as) var(--al) / .16); --blueline:hsl(var(--h) var(--as) var(--al) / .5); --onblue:#0b1330;
  --prep:#B4BCCA; --ord:#7FADFF; --paid:#6FD9A0; --over:#FF8080; --off:rgba(255,255,255,.22);
  --scrim:rgba(0,0,0,.5); color-scheme:dark}
/* Минимал: плоские сплошные поверхности, без размытия и теней. Перекрывает токены обеих тем. */
:root[data-style="flat"]{--blur:none;--pblur:none;--fx:none;--edge:none;--bg1:transparent;--bg2:transparent;--bg3:transparent;--scrim:rgba(10,14,24,.45)}
:root[data-style="flat"]{--surf:var(--solid);--surf2:var(--s2f);--pbg:var(--bg);--line:var(--lf)}
:root[data-style="flat"]{--navbg:var(--surf);--nblur:none;--ga:var(--bgf)}
:root[data-style="flat"]{--s2f:#eceff5;--lf:rgba(20,30,50,.14);--bgf:#f3f5f9}
@media (prefers-color-scheme:dark){:root[data-style="flat"]:not([data-theme="light"]){--s2f:#2a2a2e;--lf:rgba(210,215,225,.2);--bgf:#171719;--solid:#202023}}
:root[data-style="flat"][data-theme="dark"]{--s2f:#2a2a2e;--lf:rgba(210,215,225,.2);--bgf:#171719;--solid:#202023}
:root[data-style="flat"]:not([data-theme]){--bg:var(--bgf)}
:root[data-style="flat"][data-theme]{--bg:var(--bgf)}
@media (prefers-color-scheme:dark){:root[data-style="flat"]:not([data-theme="light"]){--bg:var(--bgf)}}

#wp,#wpd{position:fixed;inset:0;z-index:-1;display:none;overflow:hidden}
#wp:before{content:"";position:absolute;inset:-50px;background:var(--wpimg) center/cover no-repeat;filter:blur(var(--wpblur,0px))}
#wpd{inset:0}
html.haswp #wp,html.haswp #wpd{display:block}
html.haswp #wpd{background:linear-gradient(var(--auto,transparent),var(--auto,transparent)),rgba(0,0,0,var(--dim))}
:root[data-style="flat"]:not(.haswp){--dim:0!important}
input.hue{-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;border:1px solid var(--line);background:linear-gradient(90deg,hsl(0 85% 55%),hsl(30 90% 55%),hsl(60 90% 52%),hsl(90 65% 48%),hsl(120 55% 45%),hsl(150 55% 45%),hsl(180 70% 45%),hsl(210 80% 55%),hsl(240 75% 60%),hsl(270 65% 60%),hsl(300 60% 58%),hsl(330 75% 60%),hsl(360 85% 55%))}
input.hue::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.25);box-shadow:0 1px 4px rgba(0,0,0,.4)}
input.hue::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.25)}
html.haswp body{background-image:none;background-color:transparent}
html.haswp:not([data-style="flat"]){--surf:rgba(var(--wt),.52);--surf2:rgba(var(--wt),.64);--navbg:rgba(var(--wt),.52);--pbg:rgba(var(--wt),.8)}
html.haswp[data-wl="dark"]:not([data-style="flat"]){--wt:12,16,24;--ink:#f4f6fb;--mute:#d2d8e2;--line:rgba(255,255,255,.34);--fx:0 8px 24px rgba(0,0,0,.4),0 0 0 .5px rgba(255,255,255,.22)}
html.haswp[data-wl="light"]:not([data-style="flat"]){--wt:255,255,255;--surf:rgba(255,255,255,.62);--surf2:rgba(255,255,255,.74);--navbg:rgba(255,255,255,.6);--pbg:rgba(255,255,255,.86);--ink:#10141c;--mute:#333c4b;--line:rgba(255,255,255,.95);--fx:0 8px 24px rgba(20,30,60,.22),0 0 0 .5px rgba(30,45,80,.25)}
html.haswp[data-wl="dark"] :is(header h1,main h2,main h2 span,.sumline,.sumline b,.demo,main .note,main .f>span,.rl,.sech .f span,main .back){color:#f4f6fb;text-shadow:0 1px 4px rgba(0,0,0,.7)}
html.haswp[data-wl="light"] :is(header h1,main h2,main h2 span,.sumline,.sumline b,.demo,main .note,main .f>span,.rl,.sech .f span,main .back){color:#10141c;text-shadow:0 0 6px rgba(255,255,255,.9),0 1px 2px rgba(255,255,255,.8)}
.wpprev{width:100%;height:96px;border-radius:12px;border:1px solid var(--line);background:var(--surf2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px}
input[type=range]{width:100%;accent-color:var(--blue);margin:6px 0 2px}
.rl{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:12px}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background-color:var(--bg);background-image:linear-gradient(rgba(0,0,0,var(--dim)),rgba(0,0,0,var(--dim))),radial-gradient(62% 34% at 4% 24%,var(--bg1),transparent 78%),radial-gradient(56% 34% at 100% 50%,var(--bg2),transparent 78%),radial-gradient(62% 30% at 8% 80%,var(--bg3),transparent 78%),radial-gradient(46% 22% at 92% 6%,var(--bg3),transparent 78%),radial-gradient(40% 20% at 96% 94%,var(--bg1),transparent 78%);background-attachment:fixed;color:var(--ink);font:15px/1.4 var(--sans);overflow-wrap:anywhere;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent;position:relative;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
button:focus-visible,a:focus-visible,.inp:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
body.lock{overflow:hidden}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 0 10px}
header h1{font-size:28px;line-height:1.15;font-weight:700;margin:0;letter-spacing:-.01em}
main{flex:1;padding:2px 0 150px}
.g,.tile,.oc,.led,.sum,.chip,.cal,.setrow,.menu,.ib,.segp,.calnav button,.calnav label,.tg,.empty,.btn,.inp,.soc,.toggle.solo,.pickb{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.ib{width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--surf);display:flex;align-items:center;justify-content:center;box-shadow:var(--edge),var(--fx)}
.ib svg{width:20px;height:20px}
nav{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;margin:0 auto;max-width:536px;background:var(--navbg);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:var(--edge),var(--fx);-webkit-backdrop-filter:var(--nblur);backdrop-filter:var(--nblur)}
:root[data-style="flat"] nav{left:0;right:0;bottom:0;max-width:none;border-radius:0;border-width:1px 0 0;padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
nav div{max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;align-items:center}
.addnav{width:46px;height:46px;margin:0 auto;border-radius:14px;background:var(--blue);color:var(--onblue)!important;display:flex;align-items:center;justify-content:center;padding:0!important}
.addnav svg{width:24px;height:24px;stroke-width:2}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font-size:12px;font-weight:500;color:var(--mute);position:relative;text-align:center;border-radius:20px}
:root[data-style="flat"] nav button{border-radius:12px}
nav button svg{width:23px;height:23px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--blue2);color:var(--blue)}
.dot{position:absolute;top:6px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--s-over)}
h2{font-size:20px;font-weight:700;margin:0;display:flex;align-items:baseline;gap:10px}
h2 span{font-size:14px;font-weight:400;color:var(--mute)}
.sech{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 0 12px}
.mute{color:var(--mute)} .sm{font-size:13px}
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.tile{flex:0 0 calc(50% - 5px);min-width:0;scroll-snap-align:start;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--edge),var(--fx);display:block}
.tile small{display:block;color:var(--mute);font-size:12px;margin-bottom:4px}
.tile small i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--c);vertical-align:1px}
.tile b{font-size:18px;font-weight:700;white-space:nowrap}
.tile em{display:block;font-style:normal;color:var(--mute);font-size:13px;margin-top:2px}
.tile.on{border-color:var(--blue)}
.cards{display:flex;flex-direction:column;gap:10px}
.oc{background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--edge),var(--fx);padding:12px 14px 12px 16px;display:flex;flex-direction:column;gap:7px;cursor:pointer;position:relative;overflow:hidden;--c:var(--s-prep);transition:transform .12s}
.oc:active{transform:scale(.99)}
.oc:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.oc.ord{--c:var(--s-ord)} .oc.paid{--c:var(--s-paid)} .oc.over{--c:var(--s-over)}
.oc .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.oc .l1 b{font-size:16px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc .amt{font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.oc .l2{display:flex;justify-content:space-between;gap:10px;align-items:center}
.oc .meta{color:var(--mute);font-size:13px;min-width:0}
.tagover{color:var(--over);font-weight:600}
.pill{--c:var(--s-prep);--ct:var(--prep);display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 38%,transparent);background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ct);font-size:12.5px;font-weight:600;white-space:nowrap;flex:none}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.pill:after{content:"";width:5px;height:5px;border-right:1.6px solid var(--c);border-bottom:1.6px solid var(--c);transform:translateY(-2px) rotate(45deg);margin-left:1px}
.pill.ord{--c:var(--s-ord);--ct:var(--ord)} .pill.paid{--c:var(--s-paid);--ct:var(--paid)} .pill.over{--c:var(--s-over);--ct:var(--over)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 6px}
.seg3 .pill{justify-content:center;padding:11px 6px;opacity:.55;font-size:14px}
.seg3 .pill:after{display:none}
.seg3 .pill.on{opacity:1;box-shadow:inset 0 0 0 1px var(--c)}
.st{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600}
.st:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--s-prep)}
.st.ord:before{background:var(--s-ord)} .st.paid:before{background:var(--s-paid)} .st.over{color:var(--over)} .st.over:before{background:var(--s-over)}
.sumline{display:flex;gap:8px;align-items:baseline;margin:0 2px 12px;color:var(--mute)}
.sumline b{color:var(--ink);font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line);padding:8px 14px;font-size:14px;font-weight:500;background:var(--surf);color:var(--mute);border-radius:999px;position:relative;box-shadow:var(--edge)}
.chip.on{background:var(--blue2);border-color:var(--blueline);color:var(--ink)}
.led{background:var(--surf);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--edge),var(--fx)}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;padding:13px 15px;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row b{font-weight:600;display:block}
.row .rr{text-align:right}
.row small{color:var(--mute);font-size:13px;display:block}
.setrow{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;width:100%;padding:12px 14px;background:var(--surf);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--edge),var(--fx)}
.setrow .ic{width:40px;height:40px;border-radius:12px;background:var(--blue2);color:var(--blue);display:flex;align-items:center;justify-content:center}
.setrow .ic svg{width:22px;height:22px}
.setrow b{display:block;font-size:16px;font-weight:600}
.setrow small{display:block;color:var(--mute);font-size:13px}
.chev{width:16px;height:16px;color:var(--mute)}
.btn{border:1px solid var(--blueline);padding:12px 16px;border-radius:12px;font-size:15px;font-weight:600;text-align:center;background:var(--blue2);color:var(--ink);box-shadow:var(--edge)}
.btn:active{filter:brightness(.95)}
.btn.on{background:var(--blue);border-color:var(--blue);color:var(--onblue)}
.btn.quiet{border-color:var(--line);background:var(--surf2);font-weight:500}
.btn.danger{color:var(--over)}
.btn.dfill{background:var(--s-over);border-color:var(--s-over);color:#fff}
.btn.wide{width:100%;display:block}
.btn.sm2{padding:8px 12px;font-size:13px;border-radius:11px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.bar .btn{flex:1;min-width:104px}
.inp,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);background:var(--surf2);border-radius:12px;min-width:0;font-size:16px}
.inp:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
textarea{resize:none;min-height:46px;overflow:hidden;display:block;line-height:1.4}
.f{display:block;margin:14px 0 0;font-size:13px;font-weight:500;color:var(--mute)}
.f>*:not(span){margin-top:6px;font-size:16px;font-weight:400;color:var(--ink)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f{min-width:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;min-height:46px;line-height:1.2}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;min-width:0}
.cm{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row>div:first-child,.ev>div{min-width:0}
.amt .ai,.ev .ai{width:15px;height:15px;vertical-align:-2px;margin-right:4px;color:var(--mute)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;background:var(--pbg);-webkit-backdrop-filter:var(--pblur);backdrop-filter:var(--pblur);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;box-shadow:var(--edge);padding:22px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.panel h3{font-size:22px;font-weight:700;margin:0 0 8px}
.panel h2{font-size:17px;margin:22px 0 10px}
.kv{display:grid;grid-template-columns:112px 1fr;gap:9px 12px;margin:14px 0;font-size:15px}
.kv dt{color:var(--mute)} .kv dd{margin:0}
.hist{font-size:13px;color:var(--mute);margin:0;padding:0;list-style:none}
.hist li{padding:8px 0;border-bottom:1px solid var(--line2)}
.file{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2);font-size:14px}

  const payBlock=h.per==='stat'?'':`<div class="sech"><h2>Оплаты <span>${pay.length} шт.</span></h2></div>
  <div class="sumline">К оплате: <b>${nf(pay.reduce((a,o)=>a+o.amount,0))} ₽</b></div>${payCards(pay)}`;
  return `${REMOTE&&!netOk?'<div class="net">Нет связи с сервером, изменения отправятся позже</div>':''}${nav}

/* ---------- оплаты ---------- */
function payList(){
  const p=ui.pay,T=today(),L=ORD();
  const [ra,rb]=p.per==='week'?[monday(T),addD(monday(T),6)]:p.per==='month'?[T.slice(0,7)+'-01',fD(new Date(+T.slice(0,4),+T.slice(5,7),0))]:['0000','9999'];
  const inR=x=>x>=ra&&x<=rb,byPd=(a,b)=>pd(a).localeCompare(pd(b))||a.date.localeCompare(b.date),rows=[];
  if(p.cat==='unpaid'){
    const base=L.filter(o=>!o.paid&&o.ordered);
    base.filter(isOver).sort(byPd).forEach(o=>rows.push({o}));
    base.filter(o=>!isOver(o)&&tDays(o)===0).sort(byPd).forEach(o=>rows.push({o}));
    const rest=base.filter(o=>!isOver(o)&&tDays(o)>0&&inR(pd(o))).sort(byPd),gs={};
    rest.forEach(o=>{gs[pd(o)]=(gs[pd(o)]||0)+o.amount});
    rest.forEach(o=>rows.push({o,g:pd(o),gs:gs[pd(o)]}));
  }else L.filter(o=>o.paid&&inR(o.date)).sort((a,b)=>pd(b).localeCompare(pd(a))||b.date.localeCompare(a.date)).forEach(o=>rows.push({o}));
  const M=rows.length,PS=10,pages=Math.max(1,Math.ceil(M/PS));if(p.page>=pages)p.page=pages-1;if(p.page<0)p.page=0;
  if(!M)return '<div class="empty">Нет оплат</div>';
  let h='',last=null;
  rows.slice(p.page*PS,p.page*PS+PS).forEach(r=>{if(r.g&&r.g!==last)h+=`<div class="gh"><span>${dm(r.g)}, ${wd(r.g)}</span><b>${nf(r.gs)} ₽</b></div>`;last=r.g||null;h+=orderRow(r.o)});
  return `<div class="cards">${h}</div>`+(pages>1?`<div class="pager"><button class="btn quiet sm2" data-a="ppage" data-v="prev" ${p.page?'':'disabled'}>‹ Назад</button><span class="mute sm">${Math.min((p.page+1)*PS,M)} из ${M}</span><button class="btn quiet sm2" data-a="ppage" data-v="next" ${p.page<pages-1?'':'disabled'}>Далее ›</button></div>`:'')}
function vPay(){const p=ui.pay;
  return `${segp([['unpaid','К оплате',ORD().some(isOver)],['paid','Оплачено']],p.cat,'pcat')}
  ${segp([['all','Все'],['week','Неделя'],['month','Месяц']],p.per,'pper')}<div id="pl" style="margin-top:12px">${payList()}</div>`}

/* ---------- календарь ---------- */
const skey=o=>isOver(o)?'over':stOf(o);
const SN={prep:'Подготовлен',ord:'Заказан',paid:'Оплачен',over:'Просрочен'};
function events(){const ev=[];ORD().forEach(o=>{if(ui.cal.hidePaid&&o.paid)return;const k=skey(o);ev.push({d:o.date,k,o});if(k==='over'){const p=pd(o);if(p.slice(0,7)!==o.date.slice(0,7))ev.push({d:p,k:'over',o,due:true})}});return ev}
const evRow=e=>`<button class="ev" data-a="open" data-id="${e.o.id}"><i class="ek ${e.k}"></i><div><span class="k">${SN[e.k]}${e.due?' · срок оплаты':''}</span>${esc(supName(e.o.sup))}${e.o.comment?`<div class="cm">${esc(e.o.comment)}</div>`:''}</div><b class="sm">${e.o.file?svg('clip','ai'):''}${rub(e.o.amount)}</b></button>`;
function vCal(){
  const c=ui.cal,T=today(),ev=events(),by={};ev.forEach(e=>(by[e.d]=by[e.d]||[]).push(e));
  const list=d=>(by[d]||[]).map(evRow).join('')||'<div class="empty">В этот день заказов нет</div>';
  let body='',label='';const cur=toD(c.cur);
  if(c.mode==='month'){
    label=MN[cur.getMonth()]+' '+cur.getFullYear();
    const first=new Date(cur.getFullYear(),cur.getMonth(),1),lead=(first.getDay()+6)%7,dim=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
    let g=['пн','вт','ср','чт','пт','сб','вс'].map(x=>`<div class="h">${x}</div>`).join('');
    const total=Math.ceil((lead+dim)/7)*7;
    for(let i=0;i<total;i++){const d=fD(new Date(cur.getFullYear(),cur.getMonth(),i-lead+1)),inM=d.slice(0,7)===c.cur.slice(0,7),ks=(by[d]||[]).slice(0,6).map(e=>e.k);
      g+=`<button class="cd ${inM?'':'out'} ${d===c.sel?'cs':''} ${d===T?'tod':''}" data-a="cday" data-v="${d}"><span class="n">${+d.slice(8)}</span><span class="ds">${ks.map(k=>`<i class="${k}"></i>`).join('')}</span></button>`}
    body=`<div class="cal">${g}</div><div class="sech" style="margin:18px 0 10px"><h2>${dm(c.sel)}, ${wd(c.sel)}</h2></div><div class="led">${list(c.sel)}</div>`;
  }else if(c.mode==='week'){
    const m=monday(c.cur);label=dm(m)+' – '+dm(addD(m,6));
    body=Array.from({length:7},(_,i)=>addD(m,i)).map(d=>`<div class="sech" style="margin:16px 0 8px"><h2>${dm(d)}, ${wd(d)} ${d===T?'<span>сегодня</span>':''}</h2></div><div class="led">${list(d)}</div>`).join('');
  }else{label=dm(c.cur)+', '+wd(c.cur);body=`<div class="led">${list(c.cur)}</div>`}
  return `${segp([['day','День'],['week','Неделя'],['month','Месяц']],c.mode,'cmode')}<div class="calnav"><button data-a="cprev" aria-label="Назад">${svg('prev')}</button><label>${label}<input type="date" id="cjump" value="${c.cur}"></label><button data-a="cnext" aria-label="Вперёд"><svg class="i" viewBox="0 0 24 24" style="transform:scaleX(-1)">${IC.prev}</svg></button></div>
  <button class="chip ${c.hidePaid?'on':''}" data-a="chide" style="margin:0 0 12px">Скрыть оплаченные</button>
  <div>${body}</div>
  <div class="mute sm" style="margin-top:14px;display:flex;gap:14px;flex-wrap:wrap"><span><i class="ek"></i> подготовлен</span><span><i class="ek ord"></i> заказан</span><span><i class="ek paid"></i> оплачен</span><span><i class="ek over"></i> просрочен</span></div>`}

/* ---------- поставщики ---------- */

/* ---------- настройки ---------- */
function shownDays(){const s=S.settings;if(Array.isArray(s.rdy))return s.rdy.slice();return [0,1,5,...s.rd.filter(d=>![0,1,5,2,3].includes(d)).sort((a,b)=>a-b)]}
function fmtUser(u){if(u.kind==='username')return '@'+u.value;const v=String(u.value);return v.length===11&&v[0]==='7'?'+7 '+v.slice(1,4)+' '+v.slice(4,7)+'-'+v.slice(7,9)+'-'+v.slice(9,11):'+'+v}
function parseUser(v){v=(v||'').trim();if(!v)return{err:'Введите @username или номер телефона'};
  if(/^@|^[A-Za-z]/.test(v)){const u=v.replace(/^@/,'').toLowerCase();return /^[a-z][a-z0-9_]{4,31}$/.test(u)?{kind:'username',value:u}:{err:'Имя пользователя: 5–32 символа, латиница, цифры и _'}}
  let d=v.replace(/\D/g,'');if(d.length===11&&d[0]==='8')d='7'+d.slice(1);else if(d.length===10)d='7'+d;
  return d.length>=11&&d.length<=15?{kind:'phone',value:d}:{err:'Введите номер телефона полностью'}}
function usForm(){sheet(`<h3>Новый пользователь</h3><label class="f"><span>@username или номер телефона</span><input class="inp" id="u-v" autocomplete="off"></label><div class="bar"><button class="btn quiet" data-a="close">Отмена</button><button class="btn on" data-a="usSave">Добавить</button></div><div id="u-err" style="color:var(--over);font-size:13px"></div>`)}
function L2(mo){const l=ORD().filter(o=>o.date.slice(0,7)===mo),by={};l.filter(o=>o.paid).forEach(o=>{by[o.sup]=(by[o.sup]||0)+o.amount});
  return{paid:l.filter(o=>o.paid).reduce((a,o)=>a+o.amount,0),tot:l.reduce((a,o)=>a+o.amount,0),rows:Object.entries(by).map(([k,v])=>[supName(k),v]).filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1])}}

    ${mm.rows.length?`<div class="led">${mm.rows.map(r=>`<div class="row"><b>${esc(r[0])}</b><span style="font-weight:600">${nf(r[1])} ₽</span></div>`).join('')}</div>`:''}`}
  if(m==='sup')return back+vSup();

    ${l.length?'<div class="bar"><button class="btn wide danger" data-a="trClear">Очистить корзину</button></div>':''}`}
  if(m==='log')return back+`<input class="inp" id="lq" placeholder="Поиск" value="${esc(ui.logq)}"><div id="ll" style="margin-top:10px">${logList()}</div>`;

  else h.cur=addD(h.cur,n*(h.mode==='week'?7:1));

function shiftCal(n){const c=ui.cal;
  if(c.mode==='month'){const d=toD(c.cur);const x=new Date(d.getFullYear(),d.getMonth()+n,1);c.cur=fD(x);c.sel=c.cur.slice(0,7)===today().slice(0,7)?today():c.cur}
  else{c.cur=addD(c.cur,n*(c.mode==='week'?7:1));c.sel=c.cur}
  render()}

function wpPrep(file,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q||.82))};im.onerror=()=>rej();im.src=u})}
let WPL=null;
function wpLum(){if(!WP){WPL=null;return}const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.drawImage(im,0,0,16,16);const d=x.getImageData(0,0,16,16).data;let t=0;for(let i=0;i<d.length;i+=4)t+=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255;WPL=t/256;tintWp()};im.src=WP}
function tintWp(){const h=document.documentElement;if(WPL==null){h.removeAttribute('data-wl');h.style.removeProperty('--auto');accentLook();return}
  const dk=effTheme()==='dark';h.setAttribute('data-wl',dk?'dark':'light');
  const L=WPL*(1-UI.dim/100);let auto='transparent';
  if(dk&&L>.3)auto='rgba(0,0,0,'+Math.min(.6,(L-.3)/L).toFixed(2)+')';else if(!dk&&L<.7)auto='rgba(255,255,255,'+Math.min(.6,(.7-L)/(1-L)).toFixed(2)+')';
